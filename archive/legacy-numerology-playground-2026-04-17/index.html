<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生命靈數 · 小小覺察入口</title>
  <style>
    /* ====== 基本版面設定 ====== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        sans-serif;
      background: radial-gradient(circle at top, #fdf2ff, #f5f5f5);
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      background: #ffffffdd;
      backdrop-filter: blur(8px);
      border-radius: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
      padding: 24px 20px 20px;
      margin: 16px;
    }

    .app-header {
      margin-bottom: 16px;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill {
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid #e0d4ff;
      background: #f7f3ff;
      color: #5b3fd1;
    }

    .streak-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      color: #6b4700;
      font-weight: 600;
      margin-left: auto;
    }

    .app-subtitle {
      font-size: 0.9rem;
      color: #777;
      margin: 0;
    }

    /* ====== 表單 ====== */
    .card {
      border-radius: 16px;
      border: 1px solid #eee;
      padding: 16px 14px;
      margin-bottom: 14px;
      background: #fff;
    }

    label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 6px;
      color: #555;
    }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input[type="date"] {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      font-size: 0.95rem;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #6c5ce7, #a66bff);
      color: #fff;
      box-shadow: 0 8px 20px rgba(93, 76, 255, 0.35);
      transition: transform 0.08s ease, box-shadow 0.08s ease,
        opacity 0.12s ease;
      white-space: nowrap;
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px rgba(93, 76, 255, 0.35);
      opacity: 0.9;
    }

    /* ====== 結果卡片 ====== */
    .result {
      display: none; /* 一開始先隱藏，計算後再顯示 */
      margin-top: 6px;
    }

    .result.show {
      display: block;
    }

    .number-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #f3edff;
      color: #5b3fd1;
      font-size: 1.3rem;
      font-weight: 700;
      margin-right: 10px;
    }

    .result-title-row {
      display: flex;
      align-items: center;
      margin-bottom: 6px;
    }

    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      margin-bottom: 2px;
    }

    .result-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .result-tagline {
      font-size: 0.9rem;
      color: #666;
      margin-top: 2px;
    }

    .result-desc {
      font-size: 0.9rem;
      color: #444;
      margin-top: 10px;
      line-height: 1.5;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #eee;
      background: #fafafa;
      color: #666;
    }

    /* ====== 今日提示 ====== */
    .tip-card {
      border-radius: 16px;
      border: 1px dashed #ded3ff;
      padding: 12px 12px 10px;
      background: #fbf9ff;
      margin-top: 10px;
    }

    .tip-label {
      font-size: 0.8rem;
      color: #8a6eff;
      margin-bottom: 4px;
    }

    .tip-text {
      font-size: 0.9rem;
      color: #51416f;
      line-height: 1.5;
    }

    /* ====== 情緒紀錄 ====== */
    .mood-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 12px;
      font-size: 0.85rem;
      color: #666;
    }

    .mood-buttons button {
      background: #f5f5f5;
      color: #555;
      box-shadow: none;
      padding: 4px 8px;
      font-size: 1.1rem;
    }

    .mood-buttons button.selected {
      background: #ffeaa7;
    }

    .footer-note {
      margin-top: 8px;
      font-size: 0.75rem;
      color: #aaa;
      line-height: 1.4;
    }

    /* ====== 花園入口連結 ====== */
    .garden-link {
      text-align: center;
      margin: 16px 0 8px;
      padding: 12px;
      background: linear-gradient(135deg, #f0e8ff, #fdf2ff);
      border-radius: 12px;
      border: 1px dashed #d8b4ff;
    }

    .garden-link a {
      display: inline-block;
      padding: 10px 20px;
      background: linear-gradient(135deg, #d8b4ff, #9f7aea);
      color: white;
      text-decoration: none;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 4px 12px rgba(159, 122, 234, 0.3);
      transition: all 0.2s;
    }

    .garden-link a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(159, 122, 234, 0.4);
    }

    .garden-link p {
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: #9f7aea;
      line-height: 1.4;
    }

    /* ====== 今日能量卡片 ====== */
    .energy-card {
      border-radius: 12px;
      border: 1px solid #e6dcff;
      padding: 12px;
      background: linear-gradient(135deg, #f9f5ff, #f0e8ff);
      margin-bottom: 12px;
    }

    /* ====== 天賦密碼卡片 ====== */
    .talent-section {
      border-radius: 12px;
      border: 1px solid #e6dcff;
      padding: 14px;
      background: linear-gradient(135deg, #fff9f0, #fff5e6);
      margin-top: 12px;
      margin-bottom: 12px;
    }

    .talent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .talent-label {
      font-size: 0.8rem;
      color: #d97706;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .deep-reading-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
      padding: 4px 12px;
      font-size: 0.75rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.3);
      transition: all 0.2s;
    }

    .deep-reading-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(217, 119, 6, 0.4);
    }

    .deep-reading-btn:active {
      transform: translateY(0);
    }

    .talent-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 400px) {
      .talent-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .talent-card {
      background: white;
      border-radius: 10px;
      padding: 10px;
      border: 1px solid #fed7aa;
      text-align: center;
    }

    .talent-type {
      font-size: 0.7rem;
      color: #92400e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .talent-number {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #92400e;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 700;
      margin: 6px auto;
      box-shadow: 0 2px 6px rgba(217, 119, 6, 0.15);
    }

    .talent-name {
      font-size: 0.85rem;
      font-weight: 600;
      color: #78350f;
      margin-bottom: 4px;
    }

    .talent-desc {
      font-size: 0.75rem;
      color: #a16207;
      line-height: 1.3;
    }

    .energy-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .energy-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 60px;
    }

    .energy-label {
      font-size: 0.7rem;
      color: #8a6eff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .energy-number {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #9f7aea, #6c5ce7);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.2);
    }

    .energy-desc {
      font-size: 0.85rem;
      color: #51416f;
      line-height: 1.4;
      flex: 1;
    }

    /* ====== 歷史紀錄 ====== */
    .history-section {
      display: none;
      margin-top: 14px;
    }

    .history-section.show {
      display: block;
    }

    .history-header {
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #fafafa;
      border-radius: 10px;
      font-size: 0.85rem;
    }

    .history-date {
      color: #999;
      min-width: 80px;
    }

    .history-mood {
      font-size: 1rem;
    }

    .history-text {
      color: #666;
      flex: 1;
    }

    .empty-history {
      font-size: 0.85rem;
      color: #aaa;
      text-align: center;
      padding: 12px;
    }

    @media (max-width: 360px) {
      .app {
        padding: 18px 14px 16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">

  <script src="combo-tips.js"></script>

  <script>
    // ====== LocalStorage 工具函式 ======
    const STORAGE_KEY = {
      BIRTHDATE: 'lifepath_birthdate',
      MOOD_LOGS: 'lifepath_mood_logs',
      LIFE_NUMBER: 'lifepath_life_number'
    };

    function saveBirthdate(dateStr) {
      localStorage.setItem(STORAGE_KEY.BIRTHDATE, dateStr);
    }

    function loadBirthdate() {
      return localStorage.getItem(STORAGE_KEY.BIRTHDATE);
    }

    function saveLifeNumber(num) {
      localStorage.setItem(STORAGE_KEY.LIFE_NUMBER, num.toString());
    }

    function loadLifeNumber() {
      const num = localStorage.getItem(STORAGE_KEY.LIFE_NUMBER);
      return num ? parseInt(num) : null;
    }

    function loadMoodLogs() {
      const logs = localStorage.getItem(STORAGE_KEY.MOOD_LOGS);
      return logs ? JSON.parse(logs) : [];
    }

    function saveMoodLog(mood, lifeNumber) {
      const logs = loadMoodLogs();
      // 使用本地時間而非 UTC 時間
      const now = new Date();
      const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`; // YYYY-MM-DD

      // 檢查今天是否已經記錄過，如果有就更新
      const existingIndex = logs.findIndex(log => log.date === today);

      const newLog = {
        date: today,
        mood: mood,
        lifeNumber: lifeNumber,
        timestamp: Date.now()
      };

      if (existingIndex >= 0) {
        logs[existingIndex] = newLog;
      } else {
        logs.push(newLog);
      }

      // 只保留最近 30 天的紀錄
      const thirtyDaysAgo = Date.now() - (30 * 24 * 60 * 60 * 1000);
      const filteredLogs = logs.filter(log => log.timestamp > thirtyDaysAgo);

      localStorage.setItem(STORAGE_KEY.MOOD_LOGS, JSON.stringify(filteredLogs));
      return filteredLogs;
    }

    function calculateStreak() {
      const logs = loadMoodLogs();
      if (logs.length === 0) return 0;

      // 按日期排序（最新在前）
      logs.sort((a, b) => b.timestamp - a.timestamp);

      let streak = 0;
      let checkDate = new Date();

      for (let i = 0; i < logs.length; i++) {
        const logDate = logs[i].date;
        // 使用本地時間而非 UTC 時間
        const expectedDate = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;

        if (logDate === expectedDate) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }

      return streak;
    }

    // ====== 資料定義：每個生命靈數的基本資訊 ======

        keywords: "創意 / 表達 / 玩心",
        desc: "你是讓氛圍變得輕盈、有趣的人。當你真實地分享你的感受與故事，別人會因此鬆開心裡的一些結。",
        tips: [

      4: {

    // ====== 工具函式：計算生命靈數（1~9） ======
    function calculateLifePath(dateStr) {
      if (!dateStr) return null;

      // 只保留數字，例如 "1990-07-15" -> "19900715"
      const digits = dateStr.replace(/\D/g, "");
      if (!digits) return null;

      let sum = 0;
      for (let i = 0; i < digits.length; i++) {
        sum += Number(digits[i]);
      }

      // 持續把位數相加，直到剩一位數（1~9）
      while (sum > 9) {
        sum = sum
          .toString()
          .split("")
          .reduce((acc, d) => acc + Number(d), 0);
      }

      return sum; // 目前先不處理 11/22 等大師數，保持 v1 簡單
    }

    // ====== 工具函式：計算今日能量數字 ======
    function calculateDailyEnergy() {
      const date = new Date();
      const year = date.getFullYear().toString();
      const month = (date.getMonth() + 1).toString().padStart(2, "0");
      const day = date.getDate().toString().padStart(2, "0");
      const dateStr = year + month + day; // YYYYMMDD

      let sum = 0;
      for (let i = 0; i < dateStr.length; i++) {
        sum += Number(dateStr[i]);
      }

      // 持續相加直到剩一位數
      while (sum > 9) {
        sum = sum
          .toString()
          .split("")
          .reduce((acc, d) => acc + Number(d), 0);
      }

      return sum;
    }

    // ====== 工具函式：取得結合建議（生命靈數 × 今日能量） ======
    function getCombinedDailyTip(lifeNumber) {
      const dailyEnergy = calculateDailyEnergy();

      // 檢查 comboTips 是否存在
      if (!window.comboTips || !window.comboTips[lifeNumber.toString()]) {
        return "今天也是很好的一天，記得對自己溫柔一點。";
      }

      const profile = window.comboTips[lifeNumber.toString()];
      return profile[dailyEnergy.toString()] || "今天也是很好的一天，記得對自己溫柔一點。";
    }

    // ====== 工具函式：取得每日提示（根據日期輪換）[已棄用，改用 getCombinedDailyTip] ======
    function getDailyTip(lifeNumber) {
      const data = lifeData[lifeNumber];
      if (!data || !data.tips) return data.tip; // fallback

      // 用今天的日期來決定顯示哪一條 tip
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
      const tipIndex = dayOfYear % data.tips.length;

      return data.tips[tipIndex];
    }

    // ====== 工具函式：渲染歷史紀錄 ======
    function renderHistory() {
      const logs = loadMoodLogs();
      const historySection = document.getElementById("history-section");
      const historyList = document.getElementById("history-list");

      if (logs.length === 0) {
        historySection.classList.remove("show");
        return;
      }

      // 按日期排序（最新在前），只顯示最近 7 天
      logs.sort((a, b) => b.timestamp - a.timestamp);
      const recentLogs = logs.slice(0, 7);

      const moodEmoji = {
        good: '🙂',
        ok: '😐',
        bad: '☹️'
      };

      const moodText = {
        good: '感覺不錯',
        ok: '普通平穩',
        bad: '有點卡住'
      };

      historyList.innerHTML = recentLogs.map(log => {
        const date = new Date(log.date);
        const today = new Date();
        const isToday = log.date === today.toISOString().split('T')[0];
        const dateStr = isToday ? '今天' : `${date.getMonth() + 1}/${date.getDate()}`;

        return `
          <div class="history-item">
            <span class="history-date">${dateStr}</span>
            <span class="history-mood">${moodEmoji[log.mood]}</span>
            <span class="history-text">${moodText[log.mood]}</span>
          </div>
        `;
      }).join('');

      historySection.classList.add("show");
    }

    // ====== 工具函式：更新連續天數顯示 ======
    function updateStreakDisplay() {
      const streak = calculateStreak();
      const streakBadge = document.getElementById("streak-badge");

      if (streak > 0) {
        streakBadge.textContent = `🔥 ${streak} 天`;
        streakBadge.style.display = 'block';
      } else {
        streakBadge.style.display = 'none';
      }
    }

    // ====== 工具函式：更新天賦密碼顯示 ======
    function updateTalentDisplay(dateStr) {
      if (!window.calculateTalentCodes) {
        console.warn('天賦密碼計算函式尚未載入');
        return;
      }

      const talentCodes = window.calculateTalentCodes(dateStr);
      if (!talentCodes) return;

      const interpretation = window.getTalentInterpretation(talentCodes);
      if (!interpretation) return;

      // 更新事業天賦
      document.getElementById('talent-career-num').textContent = interpretation.career.number;
      document.getElementById('talent-career-name').textContent = interpretation.career.name;
      document.getElementById('talent-career-desc').textContent = interpretation.career.desc;

      // 更新家庭天賦
      document.getElementById('talent-family-num').textContent = interpretation.family.number;
      document.getElementById('talent-family-name').textContent = interpretation.family.name;
      document.getElementById('talent-family-desc').textContent = interpretation.family.desc;

      // 更新坐鎮碼
      document.getElementById('talent-throne-num').textContent = interpretation.throne.number;
      document.getElementById('talent-throne-name').textContent = interpretation.throne.name;
      document.getElementById('talent-throne-desc').textContent = interpretation.throne.desc;
    }

    // ====== 綁定畫面元素 ======
    const birthInput = document.getElementById("birthdate");
    const calcBtn = document.getElementById("calc-btn");

    const resultCard = document.getElementById("result-card");
    const lifeNumberEl = document.getElementById("life-number");
    const lifeTitleEl = document.getElementById("life-title");
    const lifeTaglineEl = document.getElementById("life-tagline");
    const lifeKeywordsEl = document.getElementById("life-keywords");
    const lifeDescEl = document.getElementById("life-desc");
    const lifeTipEl = document.getElementById("life-tip");
    const moodButtons = document.querySelectorAll(".mood-buttons button");
    const moodNoteEl = document.getElementById("mood-note");

    // ====== 頁面載入時的初始化 ======
    window.addEventListener('DOMContentLoaded', () => {
      // 載入之前存的生日
      const savedBirthdate = loadBirthdate();
      if (savedBirthdate) {
        birthInput.value = savedBirthdate;

        // 自動計算並顯示結果
        const num = loadLifeNumber();
        if (num) {
          const data = lifeData[num];
          if (data) {
            lifeNumberEl.textContent = num;
            lifeTitleEl.textContent = data.title;
            lifeTaglineEl.textContent = data.tagline;
            lifeKeywordsEl.textContent = data.keywords;
            lifeDescEl.textContent = data.desc;

            // 顯示今日能量
            const dailyEnergy = calculateDailyEnergy();
            const dailyEnergyNumEl = document.getElementById("daily-energy-num");
            const dailyEnergyNameEl = document.getElementById("daily-energy-name");
            dailyEnergyNumEl.textContent = dailyEnergy;
            dailyEnergyNameEl.textContent = window.energyNames
              ? window.energyNames[dailyEnergy.toString()]
              : dailyEnergy;

            // 使用結合建議
            lifeTipEl.textContent = getCombinedDailyTip(num);

            // 顯示天賦密碼
            updateTalentDisplay(savedBirthdate);

            resultCard.classList.add("show");
          }
        }
      }

      // 檢查今天是否已經記錄過心情
      const logs = loadMoodLogs();
      const today = new Date().toISOString().split('T')[0];
      const todayLog = logs.find(log => log.date === today);

      if (todayLog) {
        // 自動選中今天記錄的心情
        moodButtons.forEach(btn => {
          if (btn.getAttribute('data-mood') === todayLog.mood) {
            btn.classList.add('selected');
          }
        });
        moodNoteEl.textContent = '✓ 今天已經記錄過了，可以隨時更新。';
      }

      // 渲染歷史和連續天數
      renderHistory();
      updateStreakDisplay();
    });

    // ====== 點擊計算事件 ======
    calcBtn.addEventListener("click", () => {
      const dateStr = birthInput.value;
      const num = calculateLifePath(dateStr);

      if (!num) {
        alert("先選擇你的生日喔 :)");
        return;
      }

      const data = lifeData[num];
      if (!data) {
        alert("暫時只支援 1–9 的靈數計算。");
        return;
      }

      // 儲存生日和靈數
      saveBirthdate(dateStr);
      saveLifeNumber(num);

      // 更新生命靈數顯示
      lifeNumberEl.textContent = num;
      lifeTitleEl.textContent = data.title;
      lifeTaglineEl.textContent = data.tagline;
      lifeKeywordsEl.textContent = data.keywords;
      lifeDescEl.textContent = data.desc;

      // 顯示今日能量
      const dailyEnergy = calculateDailyEnergy();
      const dailyEnergyNumEl = document.getElementById("daily-energy-num");
      const dailyEnergyNameEl = document.getElementById("daily-energy-name");
      dailyEnergyNumEl.textContent = dailyEnergy;
      dailyEnergyNameEl.textContent = window.energyNames
        ? window.energyNames[dailyEnergy.toString()]
        : dailyEnergy;

      // 使用結合建議
      lifeTipEl.textContent = getCombinedDailyTip(num);

      // 顯示天賦密碼
      updateTalentDisplay(dateStr);

      resultCard.classList.add("show");

      // 檢查今天是否已經記錄過
      const logs = loadMoodLogs();
      const today = new Date().toISOString().split('T')[0];
      const todayLog = logs.find(log => log.date === today);

      if (todayLog) {
        moodButtons.forEach(btn => {
          if (btn.getAttribute('data-mood') === todayLog.mood) {
            btn.classList.add('selected');
          } else {
            btn.classList.remove('selected');
          }
        });
        moodNoteEl.textContent = '✓ 今天已經記錄過了，可以隨時更新。';
      } else {
        moodButtons.forEach((btn) => btn.classList.remove("selected"));
        moodNoteEl.textContent = "（選一個表情，記錄一下今天的你）";
      }
    });

    // ====== 深入解讀按鈕事件 ======
    const deepReadingBtn = document.getElementById("deep-reading-btn");
    if (deepReadingBtn) {
      deepReadingBtn.addEventListener("click", () => {
        const birthdate = birthInput.value || localStorage.getItem('lifepath_birthdate');

        if (!birthdate) {
          alert("請先輸入生日計算你的生命靈數 😊");
          return;
        }

        // 導向深度解析頁面，帶上生日參數
        window.location.href = `deep-reading.html?birthdate=${encodeURIComponent(birthdate)}`;
      });
    }

    // ====== 情緒選擇事件 ======
    moodButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        const currentLifeNumber = loadLifeNumber();
        if (!currentLifeNumber) {
          alert("請先計算你的生命靈數 :)");
          return;
        }

        moodButtons.forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        const mood = btn.getAttribute("data-mood");

        // 儲存心情記錄
        saveMoodLog(mood, currentLifeNumber);

        // 更新顯示
        const streak = calculateStreak();
        let text = "";

        if (mood === "good") {
          text = "今天覺得還不錯";
          if (streak > 1) text += `，已經連續記錄 ${streak} 天了！`;
        }
        if (mood === "ok") {
          text = "今天是普通的一天";
          if (streak > 1) text += `，堅持記錄 ${streak} 天很棒`;
        }
        if (mood === "bad") {
          text = "今天有點卡，沒關係";
          if (streak > 1) text += `，${streak} 天的你都撐過來了`;
        }

        moodNoteEl.textContent = text + "。";

        // 重新渲染歷史和連續天數
        renderHistory();
        updateStreakDisplay();
      });
    });
  </script>
